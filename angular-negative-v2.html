solute;left:0;width:100%;height:39px}.tile{position:absolute;top:4px;height:31px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.16);transition:transform .34s cubic-bezier(.2,.7,.2,1),width .34s cubic-bezier(.2,.7,.2,1),background-color .2s linear}.a{background:#f3f5f4}.b{background:#d7dcda}.c{background:#bfc6c1}.d{background:#929995}.g{background:var(--g)}.l{clip-path:polygon(10% 0,100% 0,100% 100%,0 100%,0 36%)}.r{clip-path:polygon(0 0,90% 0,100% 36%,100% 100%,0 100%)}.x{clip-path:polygon(0 0,92% 0,100% 50%,92% 100%,0 100%,6% 50%)}.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:57.5px 39px;opacity:.28;pointer-events:none}.colon .grid{background-size:35px 39px}.weekday{position:absolute;left:0;right:0;bottom:70px;text-align:center;font-size:54px;font-weight:700;letter-spacing:.2em;color:rgba(255,255,255,.94)}.foot{position:absolute;left:110px;right:110px;bottom:22px;display:flex;justify-content:space-between;font-size:14px;font-weight:600;letter-spacing:.18em;color:rgba(187,198,195,.68)}.foot .g2{color:var(--g)}</style></head><body><div id="viewport"><div id="stage"><div class="head"><div><span class="t">ANGULAR NEGATIVE SPACE</span> CLOCK TEST</div><div id="ht">14:37:52</div></div><div class="field"><div class="rail top" id="rt"></div><div class="rail bot" id="rb"></div><div class="band" id="band"></div></div><div class="weekday" id="wd">WEDNESDAY</div><div class="foot"><div><span class="g2">RULE:</span> RECTANGLES SHIFT TO CARVE THE DIGITS</div><div><span class="g2">FIELD:</span> 3840 × 804 · MELBOURNE · 24 HOUR</div></div></div></div><script>(()=>{'use strict';const SW=3840,SH=804,TZ='Australia/Melbourne',DROWS=10,DW=460,CW=70,CH=39,MODS=3,CELL=DW/8,CCELL=CW/2;const band=document.getElementById('band'),wd=document.getElementById('wd'),ht=document.getElementById('ht'),vp=document.getElementById('viewport'),stage=document.getElementById('stage');const qs=new URLSearchParams(location.search),demo=qs.get('demo')==='1',showDay=qs.get('day')!=='0';const tf=new Intl.DateTimeFormat('en-AU',{timeZone:TZ,hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}),wf=new Intl.DateTimeFormat('en-AU',{timeZone:TZ,weekday:'long'});const DIG={'0':['00111100','01111110','11100111','11000011','11000011','11000011','11000011','11100111','01111110','00111100'],'1':['00011000','00111000','01111000','00011000','00011000','00011000','00011000','00011000','01111110','01111110'],'2':['00111100','01111110','11000011','00000011','00000110','00011100','00110000','01100000','11111111','11111111'],'3':['00111100','01111110','11000011','00000011','00011110','00011110','00000011','11000011','01111110','00111100'],'4':['00000110','00001110','00011110','00110110','01100110','11000110','11111111','11111111','00000110','00000110'],'5':['11111111','11111111','11000000','11111100','11111110','00000011','00000011','11000011','01111110','00111100'],'6':['00111100','01111110','11000011','11000000','11111100','11111110','11000011','11000011','01111110','00111100'],'7':['11111111','11111111','00000011','00000110','00001100','00011000','00110000','00110000','00110000','00110000'],'8':['00111100','01111110','11000011','11000011','01111110','01111110','11000011','11000011','01111110','00111100'],'9':['00111100','01111110','11000011','11000011','01111111','00111111','00000011','11000011','01111110','00111100']};const COL=['00','00','11','11','00','00','11','11','00','00'];const slots=[];let demoSec=52,timer=0;const styles=['a l','c x','b r','d','g x','c'];function deco(){const tops=[[0,190],[580,128],[1500,228],[2470,112],[3160,210]],bots=[[90,150],[890,212],[1750,154],[2650,120],[3300,180]];for(const [i,a] of tops.entries()){let d=document.createElement('div');d.className='accent';d.style.left=a[0]+'px';d.style.top=(i%2?22:12)+'px';d.style.width=a[1]+'px';rt.appendChild(d)}for(const [i,a] of bots.entries()){let d=document.createElement('div');d.className='accent';d.style.left=a[0]+'px';d.style.top=(i%2?8:16)+'px';d.style.width=a[1]+'px';rb.appendChild(d)}}function mk(type){const el=document.createElement('div');el.className=type==='digit'?'slot':'colon';const rows=[];for(let r=0;r<DROWS;r++){const row=document.createElement('div');row.className='row';row.style.top=(r*CH)+'px';const mods=[];for(let m=0;m<MODS;m++){const t=document.createElement('div');t.className='tile '+styles[(r+m)%styles.length];row.appendChild(t);mods.push(t)}el.appendChild(row);rows.push(mods)}const g=document.createElement('div');g.className='grid';el.appendChild(g);band.appendChild(el);return{type,rows}}function segs(mask){const out=[];let s=-1;for(let i=0;i<mask.length;i++){const v=mask[i]==='1';if(!v&&s<0)s=i;if((v||i===mask.length-1)&&s>=0){out.push([s,v?i-1:i]);s=-1}}return out}function place(mods,mask,type,row){const total=type==='digit'?DW:CW,cell=type==='digit'?CELL:CCELL,pad=6,park=[18,24,16];const spans=segs(mask),maps=[];for(let i=0;i<MODS;i++){if(i<spans.length){const[a,b]=spans[i];maps.push({x:a*cell+pad,w:Math.max(16,(b-a+1)*cell-pad*2)})}else{const x=i===0?pad:i===1?total-park[i]-pad:total*.5-park[i]*.5;maps.push({x,w:park[i]})}}maps.sort((u,v)=>u.x-v.x);mods.forEach((m,i)=>{m.style.transform=`translateX(${maps[i].x}px)`;m.style.width=maps[i].w+'px';if(type==='colon')m.style.backgroundColor=(row===2||row===3||row===6||row===7)?'var(--g)':'';else m.style.backgroundColor=''})}function draw(val){val.split('').forEach((ch,i)=>{const pat=ch===':'?COL:DIG[ch];slots[i].rows.forEach((mods,r)=>place(mods,pat[r],slots[i].type,r))});ht.textContent=val}function nowStr(){let h='00',m='00',s='00';for(const p of tf.formatToParts(new Date())){if(p.type==='hour')h=p.value;else if(p.type==='minute')m=p.value;else if(p.type==='second')s=p.value}return `${h}:${m}:${s}`}function tick(){if(demo){demoSec=(demoSec+1)%60;draw(`14:37:${String(demoSec).padStart(2,'0')}`);timer=setTimeout(tick,480);return}draw(nowStr());wd.textContent=wf.format(new Date()).toUpperCase();timer=setTimeout(tick,Math.max(80,1000-Date.now()%1000+20))}function scale(){const vw=vp.clientWidth||innerWidth,vh=vp.clientHeight||innerHeight,s=Math.min(vw/SW,vh/SH),w=SW*s,h=SH*s;stage.style.left=Math.round((vw-w)/2)+'px';stage.style.top=Math.round((vh-h)/2)+'px';stage.style.transform=`scale(${s})`}['digit','digit','colon','digit','digit','colon','digit','digit'].forEach(t=>slots.push(mk(t)));deco();draw(demo?`14:37:${String(demoSec).padStart(2,'0')}`:nowStr());wd.textContent=wf.format(new Date()).toUpperCase();if(!showDay){wd.style.display='none';document.querySelector('.field').style.top='112px';}scale();tick();addEventListener('resize',scale,{passive:true});addEventListener('orientationchange',scale,{passive:true});})();</script></body></html>
