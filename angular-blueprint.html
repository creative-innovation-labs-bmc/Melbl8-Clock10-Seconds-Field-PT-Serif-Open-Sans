<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <title>Angular Tile Digit Blueprint</title>
  <link rel="stylesheet" href="angular.css">
</head>
<body>
  <div id="viewport">
    <main id="stage" class="blueprint-stage">
      <div class="blueprint-title">ANGULAR TILE DIGIT BLUEPRINT · 0–9</div>
      <div class="blueprint-subtitle">WIDE 480 × 520 DIGIT CELL · SQUARE COLON</div>
      <section id="blueprintRow" class="blueprint-row" aria-label="Digit construction set"></section>

      <section class="blueprint-rules" aria-label="Construction rules">
        <div><div class="rule-title">STRUCTURE</div><div class="rule-text">7 channels broken into rectangular modules</div></div>
        <div><div class="rule-title">MOVEMENT</div><div class="rule-text">Horizontal or vertical slide only</div></div>
        <div><div class="rule-title">SHARED TILES</div><div class="rule-text">Remain fixed between number changes</div></div>
        <div><div class="rule-title">ACCENT</div><div class="rule-text">Green appears during motion, then settles</div></div>
      </section>

      <div class="blueprint-colon" aria-label="Square colon module">
        <span class="colon-square"></span>
        <span class="colon-square"></span>
      </div>
    </main>
  </div>
  <script src="angular.js"></script>
</body>
</html>
