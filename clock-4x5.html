<!doctype html>
<html lang="en-AU">
<head>

<title>Clock 10 · 4x5 Negative Space</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#viewport{position:fixed;inset:0;overflow:hidden;background:#000}
#stage{position:absolute;left:0;top:0;width:3840px;height:804px;transform-origin:0 0;overflow:hidden;background:#373a36}

</style>
</head>
<body>
<div id="viewport"><div id="stage"><canvas id="clock" width="3840" height="804" aria-label="Melbourne 24 hour clock"></canvas></div></div>
<script>
(() => {
'use strict';
const W=3840,H=804,COLS=43,ROWS=9,CELL_W=W/COLS,CELL_H=H/ROWS,GAP=7,TZ='Australia/Melbourne',BG='#1c1b1c',BOARD='#373a36';
const COLORS=['#f3f4f2','#daddda','#c2c7c3','#919894','#89c925'];
const FONT={'0':['1111','1001','1001','1001','1111'],'1':['0110','0010','0010','0010','0111'],'2':['1111','0001','1111','1000','1111'],'3':['1111','0001','1111','0001','1111'],'4':['1001','1001','1111','0001','0001'],'5':['1111','1000','1111','0001','1111'],'6':['1111','1000','1111','1001','1111'],'7':['1111','0001','0001','0001','0001'],'8':['1111','1001','1111','1001','1111'],'9':['1111','1001','1111','0001','1111'],':':['0000','0110','0000','0110','0000']};
const PIECE_COUNTS=[7,8,7,8,7,8,7,8,7],ALL_KINETIC_ROWS=[0,1,2,3,4,5,6,7,8],OUTER_KINETIC_ROWS=[0,1,8,7],FRAME_MS=1000/30,DIGIT_TRANSITION_MS=900,ROW_TRANSITION_MS=820,MINUTE_TRANSITION_MS=1450;
const viewport=document.getElementById('viewport'),stage=document.getElementById('stage'),canvas=document.getElementById('clock'),ctx=canvas.getContext('2d',{alpha:false});ctx.imageSmoothingEnabled=false;
const params=new URLSearchParams(location.search),DEMO=params.get('demo')==='1',FIXED_TIME=/^\d{2}:\d{2}:\d{2}$/.test(params.get('time')||'')?params.get('time'):null,FIXED_SEED=Number.isFinite(Number(params.get('seed')))?Number(params.get('seed')):null,PREVIEW_FROM=/^\d{2}:\d{2}:\d{2}$/.test(params.get('from')||'')?params.get('from'):null,PREVIEW_TO=/^\d{2}:\d{2}:\d{2}$/.test(params.get('to')||'')?params.get('to'):null,PREVIEW_T=Math.max(0,Math.min(1,Number(params.get('t'))||0)),PREVIEW_ROW=Number.isFinite(Number(params.get('row')))?Math.max(0,Math.min(8,Number(params.get('row')))):0,ROW_MODE=(params.get('rows')||'all').toLowerCase(),KINETIC_ROWS=ROW_MODE==='outer'?OUTER_KINETIC_ROWS:(ROW_MODE==='none'?[]:ALL_KINETIC_ROWS),GREEN_MAX=Math.max(1,Math.min(4,parseInt(params.get('green')||'2',10)||2));
let currentTime='00:00:00',currentMask=buildMask(currentTime),currentSeed=0,currentConfig=buildConfig(currentSeed),maskTransition=null,configTransition=null,rowTransition=null,tickTimer=0,demoSeconds=22*3600+22*60+20,lastRender=0;
function scaleStage(){const vw=viewport.clientWidth||innerWidth,vh=viewport.clientHeight||innerHeight,s=Math.min(vw/W,vh/H);stage.style.left=Math.round((vw-W*s)/2)+'px';stage.style.top=Math.round((vh-H*s)/2)+'px';stage.style.transform=`scale(${s})`}
function xorshift(seed){let x=(seed|0)||123456789;return()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return((x>>>0)%1000000)/1000000}}
function neutralColor(row,index){const n=(row*19+index*13)%21;if(n<8)return COLORS[0];if(n<13)return COLORS[1];if(n<18)return COLORS[2];return COLORS[3]}
function positiveMod(n,m){return((n%m)+m)%m}
function greenCountFor(row,seed){return 1+positiveMod(seed+row*5,GREEN_MAX)}
function greenIndicesFor(row,seed){const count=PIECE_COUNTS[row],wanted=Math.min(count,greenCountFor(row,seed)),indices=[];let cursor=positiveMod(seed*3+row*2,count),step=count===8?3:2;while(indices.length<wanted){if(!indices.includes(cursor))indices.push(cursor);cursor=positiveMod(cursor+step,count)}return indices.sort((a,b)=>a-b)}
function pieceColor(row,index,seed){return greenIndicesFor(row,seed).includes(index)?COLORS[4]:neutralColor(row,index)}
function buildRowWidths(row,seed){const count=PIECE_COUNTS[row],min=2,remaining=COLS-count*min,rnd=xorshift((seed+1)*7919+row*104729),weights=[];let weightSum=0;for(let i=0;i<count;i++){let w=.3+Math.pow(rnd(),1.35)*1.6;if(i===((seed+row*2)%count))w+=1.5;weights.push(w);weightSum+=w}const widths=weights.map(w=>min+Math.floor(w/weightSum*remaining));let used=widths.reduce((a,b)=>a+b,0),cursor=(seed+row*3)%count;while(used<COLS){widths[cursor]++;used++;cursor=(cursor+3)%count}while(used>COLS){if(widths[cursor]>min){widths[cursor]--;used--}cursor=(cursor+2)%count}return widths}
function buildConfig(seed){const config=[];for(let row=0;row<ROWS;row++){const widths=buildRowWidths(row,seed);let x=0;config.push(widths.map((width,index)=>{const p={x,width,color:pieceColor(row,index,seed)};x+=width;return p}))}return config}
function buildMask(timeStr){const mask=Array.from({length:ROWS},()=>Array(COLS).fill(0));let x=2;for(const ch of timeStr){const g=FONT[ch];for(let r=0;r<5;r++)for(let c=0;c<4;c++)if(g[r][c]==='1')mask[r+2][x+c]=1;x+=5}return mask}
function changedSlots(a,b){const s=[];for(let i=0;i<Math.min(a.length,b.length);i++)if(a[i]!==b[i]){const start=2+i*5;s.push({index:i,start,end:start+3})}return s}
function slotForCol(slots,col){for(const s of slots)if(col>=s.start&&col<=s.end)return s;return null}
function buildDiffRuns(a,b,slots){const runs=[];for(let row=2;row<=6;row++){let col=0;while(col<COLS){const slot=slotForCol(slots,col);if(!slot||a[row][col]===b[row][col]){col++;continue}const type=b[row][col]===1?'cut':'fill',start=col;while(col+1<=slot.end&&a[row][col+1]!==b[row][col+1]&&(b[row][col+1]===1?'cut':'fill')===type)col++;runs.push({row,start,end:col,type,center:(start+col+1)/2,slot});col++}}return runs}
function ease(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function rowY(row){const top=row*CELL_H+(row===0?0:GAP/2),bottom=(row+1)*CELL_H-(row===ROWS-1?0:GAP/2);return{y:top,h:bottom-top}}function rowTarget(row,seed){return buildConfig(seed)[row].map(p=>({...p}))}function isGreen(p){return p&&p.color===COLORS[4]}function greenSignature(ps){const s=[];for(let i=0;i<ps.length;i++)if(isGreen(ps[i]))s.push(i);return s.join(',')}function greenPieces(ps){const r=[];for(let i=0;i<ps.length;i++)if(isGreen(ps[i]))r.push({...ps[i],index:i});return r.sort((a,b)=>(a.x+a.width/2)-(b.x+b.width/2))}function slicePiece(p,o,n){const width=p.width/n;return{x:p.x+o*width,width}}
function movingGreenPieces(tr,t){const f=greenPieces(tr.from),to=greenPieces(tr.to);if(!f.length&&!to.length)return[];if(!f.length)return to.map(p=>({...p}));if(!to.length)return f.map(p=>({...p}));const count=Math.max(f.length,to.length),tracks=[];for(let i=0;i<count;i++)tracks.push({sourceIndex:Math.min(f.length-1,Math.floor(i*f.length/count)),targetIndex:Math.min(to.length-1,Math.floor(i*to.length/count))});const st=Array(f.length).fill(0),tt=Array(to.length).fill(0);for(const q of tracks){st[q.sourceIndex]++;tt[q.targetIndex]++}const so=Array(f.length).fill(0),toO=Array(to.length).fill(0),et=ease(clamp(t,0,1)),r=[];for(const q of tracks){const s=slicePiece(f[q.sourceIndex],so[q.sourceIndex]++,st[q.sourceIndex]),d=slicePiece(to[q.targetIndex],toO[q.targetIndex]++,tt[q.targetIndex]);r.push({x:s.x+(d.x-s.x)*et,width:s.width+(d.width-s.width)*et})}return r}
function startRowRebuild(secondIndex){if(configTransition||!KINETIC_ROWS.length)return;const now=performance.now();if(rowTransition){if(now-rowTransition.start>=rowTransition.duration){currentConfig[rowTransition.row]=rowTransition.to;rowTransition=null}else return}const row=KINETIC_ROWS[((secondIndex%KINETIC_ROWS.length)+KINETIC_ROWS.length)%KINETIC_ROWS.length],from=currentConfig[row].map(p=>({...p}));let seed=currentSeed*97+secondIndex*31+row*17+1,to=rowTarget(row,seed),fromGreen=greenSignature(from),attempts=0;while(greenSignature(to)===fromGreen&&attempts<8){seed+=37;to=rowTarget(row,seed);attempts++}rowTransition={row,from,to,start:now,duration:ROW_TRANSITION_MS}}
function interpPiece(a,b,t){return{x:a.x+(b.x-a.x)*t,width:a.width+(b.width-a.width)*t,color:t<.5?a.color:b.color}}function configState(now){if(!configTransition)return{from:currentConfig,to:null,t:1,raw:1};const raw=clamp((now-configTransition.start)/configTransition.duration,0,1);return{from:configTransition.from,to:configTransition.to,t:ease(raw),raw}}function rowState(row,now,cs){if(configTransition)return{a:cs.from[row],b:cs.to[row],t:cs.t};if(rowTransition&&row===rowTransition.row){const raw=clamp((now-rowTransition.start)/rowTransition.duration,0,1);return{a:rowTransition.from,b:rowTransition.to,t:ease(raw),rowRaw:raw}}const a=currentConfig[row];return{a,b:a,t:1}}
function drawFieldBase(now){ctx.fillStyle=BOARD;ctx.fillRect(0,0,W,H);const cs=configState(now);let done=false;for(let row=0;row<ROWS;row++){const rs=rowState(row,now,cs),yh=rowY(row);for(let i=0;i<rs.a.length;i++){const p=interpPiece(rs.a[i],rs.b[i],rs.t),x=p.x*CELL_W+GAP/2,w=Math.max(1,p.width*CELL_W-GAP),moving=rowTransition&&row===rowTransition.row&&rs.rowRaw<1;ctx.fillStyle=moving?neutralColor(row,i):p.color;ctx.fillRect(x,yh.y,w,yh.h)}if(rowTransition&&row===rowTransition.row&&rs.rowRaw>=1)done=true}if(configTransition&&cs.raw>=1){currentConfig=configTransition.to;configTransition=null}if(done&&rowTransition){currentConfig[rowTransition.row]=rowTransition.to;rowTransition=null}}
function localDeform(piece,row,t,diffs){const center=piece.x+piece.width/2;let shift=0,scale=1;for(const d of diffs){if(d.row!==row)continue;const dist=Math.abs(center-d.center),radius=7;if(dist>=radius)continue;const delay=Math.min(.34,dist/radius*.34+Math.abs(row-4)*.025),lt=clamp((t-delay)/(1-delay),0,1),pulse=Math.sin(Math.PI*lt);if(pulse<=.0001)continue;const inf=(1-dist/radius)*pulse,dir=center<d.center?-1:1;if(d.type==='cut'){shift+=dir*CELL_W*.58*inf;scale-=.115*inf}else{shift-=dir*CELL_W*.48*inf;scale+=.09*inf}}const baseW=piece.width*CELL_W,newW=Math.max(CELL_W*1.05,baseW*scale),baseCenter=center*CELL_W;return{x:baseCenter+shift-newW/2,w:newW}}
function pairBoundsForSlot(s){if(s.start<=10)return{start:2,end:10};if(s.start<=25)return{start:17,end:25};return{start:32,end:40}}
function drawChangedSlotsOverlay(now,tr,t){if(!tr||!tr.slots.length)return;const cs=configState(now),groups=[];for(const slot of tr.slots){const b=pairBoundsForSlot(slot);if(!groups.some(g=>g.start===b.start&&g.end===b.end))groups.push(b)}for(const group of groups){ctx.save();ctx.beginPath();ctx.rect((group.start-.2)*CELL_W,2*CELL_H,(group.end-group.start+1.4)*CELL_W,5*CELL_H);ctx.clip();for(let row=2;row<=6;row++){const rs=rowState(row,now,cs),yh=rowY(row);for(let i=0;i<rs.a.length;i++){const p=interpPiece(rs.a[i],rs.b[i],rs.t),d=localDeform(p,row,t,tr.runs),x=d.x+GAP/2,w=Math.max(1,d.w-GAP),moving=rowTransition&&row===rowTransition.row&&rs.rowRaw<1;ctx.fillStyle=moving?neutralColor(row,i):p.color;ctx.fillRect(x,yh.y,w,yh.h)}}ctx.restore()}}
function drawMovingGreen(now){if(!rowTransition)return;const raw=clamp((now-rowTransition.start)/rowTransition.duration,0,1),pieces=movingGreenPieces(rowTransition,raw),yh=rowY(rowTransition.row);ctx.fillStyle=COLORS[4];for(const p of pieces)ctx.fillRect(p.x*CELL_W+GAP/2,yh.y,Math.max(1,p.width*CELL_W-GAP),yh.h)}
function cutWholeMask(m){ctx.fillStyle=BG;for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(m[r][c])ctx.fillRect(c*CELL_W,r*CELL_H,CELL_W+.6,CELL_H+.6)}function cutStableMask(a,b){ctx.fillStyle=BG;for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(a[r][c]&&b[r][c])ctx.fillRect(c*CELL_W,r*CELL_H,CELL_W+.6,CELL_H+.6)}function drawDiffRuns(runs,t){ctx.fillStyle=BG;for(const r of runs){const rd=Math.abs(r.row-4)*.035,lt=clamp((t-rd)/(1-rd),0,1),et=ease(lt),x=r.start*CELL_W,y=r.row*CELL_H,width=(r.end-r.start+1)*CELL_W;if(r.type==='cut'){const w=width*et;ctx.fillRect(x+(width-w)/2,y,w+.6,CELL_H+.6)}else{const w=width*(1-et);if(w>.2)ctx.fillRect(x+(width-w)/2,y,w+.6,CELL_H+.6)}}}
function render(now){if(now-lastRender<FRAME_MS){requestAnimationFrame(render);return}lastRender=now;drawFieldBase(now);if(maskTransition){const raw=clamp((now-maskTransition.start)/maskTransition.duration,0,1);drawChangedSlotsOverlay(now,maskTransition,raw);drawMovingGreen(now);cutStableMask(maskTransition.from,maskTransition.to);drawDiffRuns(maskTransition.runs,raw);if(raw>=1){currentMask=maskTransition.to;maskTransition=null}}else{drawMovingGreen(now);cutWholeMask(currentMask)}requestAnimationFrame(render)}
function melbourneParts(date){const parts=new Intl.DateTimeFormat('en-AU',{timeZone:TZ,hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(date);let hh='00',mm='00',ss='00';for(const p of parts){if(p.type==='hour')hh=p.value;else if(p.type==='minute')mm=p.value;else if(p.type==='second')ss=p.value}return{hh,mm,ss}}
function applyTime(timeStr,seed,allow=true){const next=buildMask(timeStr),slots=changedSlots(currentTime,timeStr),runs=buildDiffRuns(currentMask,next,slots);if(runs.length)maskTransition={from:currentMask,to:next,runs,slots,start:performance.now(),duration:DIGIT_TRANSITION_MS};else currentMask=next;const minuteChanged=seed!==currentSeed,hh=Number(timeStr.slice(0,2)),mm=Number(timeStr.slice(3,5)),ss=Number(timeStr.slice(6,8)),abs=hh*3600+mm*60+ss;if(ROW_MODE==='all'){if(minuteChanged)currentSeed=seed;startRowRebuild(abs)}else if(minuteChanged){rowTransition=null;if(allow)configTransition={from:currentConfig,to:buildConfig(seed),start:performance.now(),duration:MINUTE_TRANSITION_MS};else currentConfig=buildConfig(seed);currentSeed=seed}else startRowRebuild(abs);currentTime=timeStr}
function liveTick(){const p=melbourneParts(new Date()),str=`${p.hh}:${p.mm}:${p.ss}`,seed=Number(p.hh)*60+Number(p.mm);applyTime(str,seed,true);tickTimer=setTimeout(liveTick,Math.max(50,1000-Date.now()%1000+20))}function demoTick(){demoSeconds=(demoSeconds+1)%(24*3600);const hh=String(Math.floor(demoSeconds/3600)%24).padStart(2,'0'),mm=String(Math.floor(demoSeconds/60)%60).padStart(2,'0'),ss=String(demoSeconds%60).padStart(2,'0');applyTime(`${hh}:${mm}:${ss}`,Number(hh)*60+Number(mm),true);tickTimer=setTimeout(demoTick,1000)}
function initialise(){scaleStage();if(PREVIEW_FROM&&PREVIEW_TO){currentTime=PREVIEW_FROM;currentMask=buildMask(PREVIEW_FROM);currentSeed=FIXED_SEED??0;currentConfig=buildConfig(currentSeed);const next=buildMask(PREVIEW_TO),slots=changedSlots(PREVIEW_FROM,PREVIEW_TO),runs=buildDiffRuns(currentMask,next,slots),now=performance.now();maskTransition={from:currentMask,to:next,runs,slots,start:now-PREVIEW_T*DIGIT_TRANSITION_MS,duration:DIGIT_TRANSITION_MS};rowTransition={row:PREVIEW_ROW,from:currentConfig[PREVIEW_ROW].map(p=>({...p})),to:rowTarget(PREVIEW_ROW,currentSeed*97+99+PREVIEW_ROW*17),start:now-PREVIEW_T*ROW_TRANSITION_MS,duration:ROW_TRANSITION_MS}}else if(FIXED_TIME){currentTime=FIXED_TIME;currentMask=buildMask(FIXED_TIME);currentSeed=FIXED_SEED??0;currentConfig=buildConfig(currentSeed)}else{const p=melbourneParts(new Date());currentTime=`${p.hh}:${p.mm}:${p.ss}`;currentMask=buildMask(currentTime);currentSeed=Number(p.hh)*60+Number(p.mm);currentConfig=buildConfig(currentSeed);tickTimer=setTimeout(DEMO?demoTick:liveTick,DEMO?700:Math.max(50,1000-Date.now()%1000+20))}requestAnimationFrame(render)}
addEventListener('resize',scaleStage,{passive:true});addEventListener('orientationchange',scaleStage,{passive:true});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!FIXED_TIME&&!DEMO){clearTimeout(tickTimer);liveTick()}});initialise();
})();
</script>
