<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex"><title>Mosaic Static Comparison</title><style>*{box-sizing:border-box}html,body{margin:0;background:#1c1b1c;color:#fff;font-family:Arial,sans-serif}.page{width:100vw;min-height:100vh;padding:28px;display:grid;grid-template-columns:repeat(3,1fr);gap:24px;align-items:start}.card{background:#2b2f2c;padding:10px;border:1px solid rgba(255,255,255,.09)}.preview{position:relative;width:100%;aspect-ratio:3840/804;overflow:hidden;background:#373a36}.preview iframe{position:absolute;left:0;top:0;width:3840px;height:804px;border:0;transform-origin:0 0}.label{padding:10px 4px 2px;font-size:15px;letter-spacing:.12em;color:#bbc6c3}@media(max-width:1200px){.page{grid-template-columns:1fr}}</style></head><body><div class="page" id="page"></div><script>const times=['08:08:08','12:34:56','23:59:59'];const page=document.getElementById('page');times.forEach(t=>{const card=document.createElement('div');card.className='card';const p=document.createElement('div');p.className='preview';const f=document.createElement('iframe');f.src='angular-mosaic-static-v1.html?time='+encodeURIComponent(t);p.appendChild(f);const l=document.createElement('div');l.className='label';l.textContent=t;card.append(p,l);page.appendChild(card)});function fit(){document.querySelectorAll('.preview').forEach(p=>{const f=p.querySelector('iframe');f.style.transform='scale('+(p.clientWidth/3840)+')'})}fit();addEventListener('resize',fit);</script></body></html>
