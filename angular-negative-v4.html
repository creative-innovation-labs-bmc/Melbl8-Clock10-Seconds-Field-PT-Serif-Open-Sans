<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex"><title>Angular Negative Space Clock v4</title><style>:root{--bg:#373a36;--void:#1c1b1c;--w:#f4f6f5;--g1:#d9dedb;--g2:#c2c8c4;--g3:#959d99;--green:#89c925;--sw:3840px;--sh:804px}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}body{-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}#viewport{position:fixed;inset:0;background:#000}#stage{position:absolute;left:0;top:0;width:var(--sw);height:var(--sh);transform-origin:0 0;background:var(--void);overflow:hidden}#field{position:absolute;inset:0;overflow:hidden}.gridV,.gridH{position:absolute;background:rgba(255,255,255,.028);pointer-events:none}.gridV{top:0;bottom:0;width:1px}.gridH{left:0;right:0;height:1px}.row{position:absolute;left:0;right:0;height:50px}.piece{position:absolute;top:4px;height:42px;will-change:transform,width;transition:transform .34s cubic-bezier(.2,.75,.2,1),width .34s cubic-bezier(.2,.75,.2,1)}.piece.instant{transition:none}.skin{position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}.t0{background:var(--w)}.t1{background:var(--g1)}.t2{background:var(--g2)}.t3{background:var(--g3)}.t4{background:var(--green)}.rect{transform:none}.skin.rot{width:74%;height:74%;left:13%;top:13%;transform:rotate(45deg);transform-origin:center}.slantL{clip-path:polygon(14% 0,100% 0,100% 100%,0 100%,0 38%)}.slantR{clip-path:polygon(0 0,86% 0,100% 38%,100% 100%,0 100%)}</style></head><body><div id="viewport"><div id="stage"><div id="field"></div></div></div><script>(()=>{'use strict';const SW=3840,SH=804,ROWS=16,ROWH=50,TZ='Australia/Melbourne',field=document.getElementById('field'),vp=document.getElementById('viewport'),stage=document.getElementById('stage');const DIG={'0':['00111100','01111110','11100111','11000011','11000011','11000011','11000011','11100111','01111110','00111100'],'1':['00011000','00111000','01111000','00011000','00011000','00011000','00011000','00011000','01111110','01111110'],'2':['00111100','01111110','11000011','00000011','00000110','00011100','00110000','01100000','11111111','11111111'],'3':['00111100','01111110','11000011','00000011','00011110','00011110','00000011','11000011','01111110','00111100'],'4':['00000110','00001110','00011110','00110110','01100110','11000110','11111111','11111111','00000110','00000110'],'5':['11111111','11111111','11000000','11111100','11111110','00000011','00000011','11000011','01111110','00111100'],'6':['00111100','01111110','11000011','11000000','11111100','11111110','11000011','11000011','01111110','00111100'],'7':['11111111','11111111','00000011','00000110','00001100','00011000','00110000','00110000','00110000','00110000'],'8':['00111100','01111110','11000011','11000011','01111110','01111110','11000011','11000011','01111110','00111100'],'9':['00111100','01111110','11000011','11000011','01111111','00111111','00000011','11000011','01111110','00111100']};const COL=['00','00','11','11','00','00','11','11','00','00'];const chars=['fill','d1','d2','c1','d3','d4','c2','d5','d6','fill'];const widths=[520,430,430,110,430,430,110,430,430,520];const regions=[];let x=0;chars.forEach((k,i)=>{regions.push({kind:k,x,width:widths[i],cols:k==='fill'?10:(k[0]==='c'?2:8),max:k==='fill'?7:(k[0]==='c'?3:5)});x+=widths[i]});const regionMap=[1,2,3,4,5,6,7,8];const rows=[];for(let i=1;i<40;i++){const v=document.createElement('div');v.className='gridV';v.style.left=(i*96)+'px';field.appendChild(v)}for(let i=1;i<ROWS;i++){const h=document.createElement('div');h.className='gridH';h.style.top=(i*ROWH)+'px';field.appendChild(h)}for(let r=0;r<ROWS;r++){const row=document.createElement('div');row.className='row';row.style.top=(r*ROWH)+'px';field.appendChild(row);const regEls=[];regions.forEach((reg,ri)=>{const mods=[];for(let m=0;m<reg.max;m++){const piece=document.createElement('div');piece.className='piece instant';const skin=document.createElement('div');skin.className='skin rect t0';piece.appendChild(skin);row.appendChild(piece);mods.push({piece,skin})}regEls.push(mods)});rows.push(regEls)}function scale(){const vw=vp.clientWidth||innerWidth,vh=vp.clientHeight||innerHeight,s=Math.min(vw/SW,vh/SH),w=SW*s,h=SH*s;stage.style.left=Math.round((vw-w)/2)+'px';stage.style.top=Math.round((vh-h)/2)+'px';stage.style.transform=`scale(${s})`}function tone(ri,r,i){return['t0','t1','t2','t3','t4'][(ri+r+i)%5]}function shape(ri,r,i,w){if(w<42)return'rect';const v=(ri*3+r+i)%6;return v===1?'rot':v===3?'slantL':v===5?'slantR':'rect'}function fillSegments(mask){const out=[];let s=-1;for(let i=0;i<mask.length;i++){const fill=mask[i]==='0';if(fill&&s<0)s=i;if((!fill||i===mask.length-1)&&s>=0){out.push([s,!fill?i-1:i]);s=-1}}return out}function splitSegs(segs,rowIndex,cols){const pats=[[1.6,1.2,1.7,1.1],[1.3,1.8,1.2,1.5],[2.1,1.2,1.4,1.3],[1.2,1.2,1.9,1.4]];const pat=pats[rowIndex%pats.length];const out=[];for(const[a,b]of segs){let c=a,p=0;while(c<=b+.01){let len=pat[p%pat.length];if(c+len>b+1)len=b+1-c;if(len<.72)break;out.push([c,c+len]);c+=len+.18;p++}}if(!out.length&&cols>0)out.push([0,cols]);return out}function lineFor(kind,ch,row){const cols=kind==='fill'?10:(kind[0]==='c'?2:8);if(kind==='fill')return'0'.repeat(cols);if(row<3||row>12)return'0'.repeat(cols);if(kind[0]==='c')return COL[row-3];return DIG[ch][row-3]}function applyRegion(regionIndex,ch,animate){const reg=regions[regionIndex];for(let r=0;r<ROWS;r++){const mods=rows[r][regionIndex],line=lineFor(reg.kind,ch,r),chunks=splitSegs(fillSegments(line),r,reg.cols),cell=reg.width/reg.cols;for(let i=0;i<mods.length;i++){const m=mods[i],piece=m.piece,skin=m.skin;if(!animate)piece.classList.add('instant');else piece.classList.remove('instant');if(i<chunks.length){const[a,b]=chunks[i],px=reg.x+a*cell+4,pw=Math.max(10,(b-a)*cell-8);piece.style.transform=`translateX(${px}px)`;piece.style.width=pw+'px';skin.className='skin '+shape(regionIndex,r,i,pw)+' '+tone(regionIndex,r,i)}else{const px=reg.x+(i%2?reg.width-14-(i*3):4+i*3);piece.style.transform=`translateX(${px}px)`;piece.style.width='10px';skin.className='skin rect '+tone(regionIndex,r,i)}}}}let prev='';function draw(val,animate){const chars=val.split('');regionMap.forEach((ri,idx)=>{const ch=chars[idx];if(!animate||prev[idx]!==ch)applyRegion(ri,ch,animate)});prev=val}function nowStr(){const parts=new Intl.DateTimeFormat('en-AU',{timeZone:TZ,hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(new Date());let h='00',m='00',s='00';for(const p of parts){if(p.type==='hour')h=p.value;else if(p.type==='minute')m=p.value;else if(p.type==='second')s=p.value}return`${h}:${m}:${s}`}const qs=new URLSearchParams(location.search),demo=qs.get('demo')==='1',fixed=qs.get('time');let timer=0,demoVal=fixed||'12:34:56';function tick(){if(fixed){draw(fixed,false);return}if(demo){const raw=demoVal.replace(/:/g,''),n=String((Number(raw)+1)%1000000).padStart(6,'0');demoVal=`${n.slice(0,2)}:${n.slice(2,4)}:${n.slice(4,6)}`;draw(demoVal,true);timer=setTimeout(tick,430);return}draw(nowStr(),true);timer=setTimeout(tick,Math.max(60,1000-Date.now()%1000+20))}applyRegion(0,'',false);applyRegion(9,'',false);draw(fixed||nowStr(),false);scale();tick();addEventListener('resize',scale,{passive:true});addEventListener('orientationchange',scale,{passive:true});})();</script></body></html>
