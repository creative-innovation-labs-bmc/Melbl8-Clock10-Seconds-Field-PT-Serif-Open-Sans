<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <title>Angular Tile Morph Clock Prototype</title>
  <link rel="stylesheet" href="angular.css">
</head>
<body>
  <div id="viewport">
    <main id="stage" class="clock-stage" aria-label="Melbourne angular tile morph clock">
      <section id="timeDisplay" class="time-display" aria-label="Current Melbourne time"></section>
      <div class="weekday-rule" aria-hidden="true"></div>
      <div id="weekday" class="weekday">WEDNESDAY</div>
    </main>
  </div>
  <script src="angular.js"></script>
</body>
</html>
