<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="referrer" content="no-referrer">
  <title>Melbourne Weekday Reveal Clock</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="viewport" aria-label="Melbourne weekday reveal clock">
    <main id="stage" data-variant="a">
      <header class="topbar">
        <div class="location">MELBOURNE, AUSTRALIA</div>
        <div class="field-title"><span id="variantName">MOSAIC SCAN</span><span id="secondReadout">00 / 60</span></div>
      </header>

      <section class="reveal-panel" aria-label="Weekday revealed through sixty second grid">
        <div id="weekday" class="weekday">SATURDAY</div>
        <div id="revealGrid" class="reveal-grid" aria-hidden="true"></div>
      </section>

      <footer class="footer">
        <div id="time" class="time">00:00:00</div>
        <div class="footer-rule"></div>
        <div id="date" class="date">15 AUGUST 2026</div>
      </footer>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
