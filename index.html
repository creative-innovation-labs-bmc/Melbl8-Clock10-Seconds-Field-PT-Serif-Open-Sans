<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
<meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
<meta name="referrer" content="no-referrer">
<title>Clock 10 · 4x5 Negative Space</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#viewport{position:fixed;inset:0;overflow:hidden;background:#000}
#stage{position:absolute;left:0;top:0;width:3840px;height:804px;transform-origin:0 0;overflow:hidden;background:#373a36}
canvas{display:block;width:3840px;height:804px}
</style>
</head>
<body>
<div id="viewport"><div id="stage"><canvas id="clock" width="3840" height="804" aria-label="Melbourne 24 hour clock"></canvas></div></div>
<script>
(() => {
'use strict';

const W=3840,H=804,COLS=43,ROWS=9;
const CELL_W=W/COLS,CELL_H=H/ROWS,GAP=7;
const TZ='Australia/Melbourne';
const BG='#1c1b1c',BOARD='#373a36';
const COLORS=['#f3f4f2','#daddda','#c2c7c3','#919894','#89c925'];
const FONT={
 '0':['1111','1001','1001','1001','1111'],
 '1':['0110','0010','0010','0010','0111'],
 '2':['1111','0001','1111','1000','1111'],
 '3':['1111','0001','1111','0001','1111'],
 '4':['1001','1001','1111','0001','0001'],
 '5':['1111','1000','1111','0001','1111'],
 '6':['1111','1000','1111','1001','1111'],
 '7':['1111','0001','0001','0001','0001'],
 '8':['1111','1001','1111','1001','1111'],
 '9':['1111','1001','1111','0001','1111'],
 ':':['0000','0110','0000','0110','0000']
};
const PIECE_COUNTS=[7,8,7,8,7,8,7,8,7];
const viewport=document.getElementById('viewport');
const stage=document.getElementById('stage');
const canvas=document.getElementById('clock');
const ctx=canvas.getContext('2d',{alpha:false});
ctx.imageSmoothingEnabled=false;

const params=new URLSearchParams(location.search);
const DEMO=params.get('demo')==='1';
const FIXED_TIME=/^\d{2}:\d{2}:\d{2}$/.test(params.get('time')||'')?params.get('time'):null;
const FIXED_SEED=Number.isFinite(Number(params.get('seed')))?Number(params.get('seed')):null;
const PREVIEW_FROM=/^\d{2}:\d{2}:\d{2}$/.test(params.get('from')||'')?params.get('from'):null;
const PREVIEW_TO=/^\d{2}:\d{2}:\d{2}$/.test(params.get('to')||'')?params.get('to'):null;
const PREVIEW_T=Math.max(0,Math.min(1,Number(params.get('t'))||0));

let currentTime='00:00:00';
let currentMask=buildMask(currentTime);
let currentSeed=0;
let currentConfig=buildConfig(currentSeed);
let maskTransition=null;
let configTransition=null;
let frameHandle=0;
let tickTimer=0;
let demoSeconds=22*3600+22*60+20;
let demoTickCount=0;

function scaleStage(){
 const vw=viewport.clientWidth||window.innerWidth;
 const vh=viewport.clientHeight||window.innerHeight;
 const s=Math.min(vw/W,vh/H);
 stage.style.left=Math.round((vw-W*s)/2)+'px';
 stage.style.top=Math.round((vh-H*s)/2)+'px';
 stage.style.transform=`scale(${s})`;
}

function xorshift(seed){
 let x=(seed|0)||123456789;
 return()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return((x>>>0)%1000000)/1000000};
}

function pieceColor(row,index){
 const n=(row*19+index*13)%25;
 if(n===0||n===11)return COLORS[4];
 if(n<10)return COLORS[0];
 if(n<16)return COLORS[1];
 if(n<21)return COLORS[2];
 return COLORS[3];
}

function buildRowWidths(row,seed){
 const count=PIECE_COUNTS[row],min=2,remaining=COLS-count*min;
 const rnd=xorshift((seed+1)*7919+row*104729);
 const weights=[];let weightSum=0;
 for(let i=0;i<count;i++){
  let w=0.3+Math.pow(rnd(),1.35)*1.6;
  if(i===((seed+row*2)%count))w+=1.5;
  weights.push(w);weightSum+=w;
 }
 const widths=weights.map(w=>min+Math.floor((w/weightSum)*remaining));
 let used=widths.reduce((a,b)=>a+b,0),cursor=(seed+row*3)%count;
 while(used<COLS){widths[cursor]+=1;used+=1;cursor=(cursor+3)%count}
 while(used>COLS){if(widths[cursor]>min){widths[cursor]-=1;used-=1}cursor=(cursor+2)%count}
 return widths;
}

function buildConfig(seed){
 const config=[];
 for(let row=0;row<ROWS;row++){
  const widths=buildRowWidths(row,seed);let x=0;
  config.push(widths.map((width,index)=>{const p={x,width,color:pieceColor(row,index)};x+=width;return p}));
 }
 return config;
}

function buildMask(timeStr){
 const mask=Array.from({length:ROWS},()=>Array(COLS).fill(0));
 let x=2;
 for(const ch of timeStr){
  const glyph=FONT[ch];
  for(let r=0;r<5;r++)for(let c=0;c<4;c++)if(glyph[r][c]==='1')mask[r+2][x+c]=1;
  x+=5;
 }
 return mask;
}

function buildDiffRuns(oldMask,newMask){
 const runs=[];
 for(let row=0;row<ROWS;row++){
  let col=0;
  while(col<COLS){
   if(oldMask[row][col]===newMask[row][col]){col++;continue}
   const type=newMask[row][col]===1?'cut':'fill';
   const start=col;
   while(col+1<COLS&&oldMask[row][col+1]!==newMask[row][col+1]&&(newMask[row][col+1]===1?'cut':'fill')===type)col++;
   const end=col;
   const leftVoid=(type==='cut'?newMask:oldMask)[row][start-1]===1;
   const rightVoid=(type==='cut'?newMask:oldMask)[row][end+1]===1;
   let side;
   if(leftVoid&&!rightVoid)side='left';
   else if(rightVoid&&!leftVoid)side='right';
   else side=((row+start+end)&1)?'left':'right';
   runs.push({row,start,end,type,side,center:(start+end+1)/2});
   col++;
  }
 }
 return runs;
}

function ease(t){return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

function activeProgress(now){
 let maskT=1,configT=1;
 if(maskTransition)maskT=clamp((now-maskTransition.start)/maskTransition.duration,0,1);
 if(configTransition)configT=clamp((now-configTransition.start)/configTransition.duration,0,1);
 return{maskT,configT};
}

function localDeform(row,centerCells,widthCells,t,diffs){
 if(!diffs||!diffs.length)return{x:centerCells*CELL_W,w:widthCells*CELL_W};
 const pulse=Math.sin(Math.PI*t);
 if(pulse<=0.0001)return{x:centerCells*CELL_W,w:widthCells*CELL_W};
 let shift=0,scale=1;
 for(const d of diffs){
  if(d.row!==row)continue;
  const dist=Math.abs(centerCells-d.center);
  const radius=6.2;
  if(dist>=radius)continue;
  const influence=(1-dist/radius)*pulse;
  const away=centerCells<d.center?-1:1;
  const motion=d.type==='cut'?away:-away;
  shift+=motion*CELL_W*0.22*influence;
  scale+=d.type==='cut'?-0.055*influence:0.035*influence;
 }
 const baseW=widthCells*CELL_W;
 const newW=Math.max(CELL_W*1.25,baseW*scale);
 const baseCenter=centerCells*CELL_W;
 return{x:baseCenter+shift-newW/2,w:newW};
}

function drawPieces(configA,configB,configT,maskT,diffs){
 ctx.fillStyle=BOARD;ctx.fillRect(0,0,W,H);
 const ct=ease(configT),mt=ease(maskT);
 for(let row=0;row<ROWS;row++){
  const a=configA[row],b=configB?configB[row]:a;
  for(let i=0;i<a.length;i++){
   const xCells=a[i].x+(b[i].x-a[i].x)*ct;
   const wCells=a[i].width+(b[i].width-a[i].width)*ct;
   const centerCells=xCells+wCells/2;
   const deform=localDeform(row,centerCells,wCells,mt,diffs);
   const x=deform.x+GAP/2;
   const y=row*CELL_H+GAP/2;
   const w=Math.max(1,deform.w-GAP);
   const h=CELL_H-GAP;
   ctx.fillStyle=a[i].color;
   ctx.fillRect(x,y,w,h);
  }
 }
}

function cutStableMask(oldMask,newMask){
 ctx.fillStyle=BG;
 for(let row=0;row<ROWS;row++)for(let col=0;col<COLS;col++){
  if(oldMask[row][col]===1&&newMask[row][col]===1){
   ctx.fillRect(col*CELL_W,row*CELL_H,CELL_W+0.5,CELL_H+0.5);
  }
 }
}

function cutWholeMask(mask){
 ctx.fillStyle=BG;
 for(let row=0;row<ROWS;row++)for(let col=0;col<COLS;col++)if(mask[row][col]){
  ctx.fillRect(col*CELL_W,row*CELL_H,CELL_W+0.5,CELL_H+0.5);
 }
}

function drawDiffRuns(runs,t){
 const et=ease(t);ctx.fillStyle=BG;
 for(const r of runs){
  const x=r.start*CELL_W;
  const y=r.row*CELL_H;
  const width=(r.end-r.start+1)*CELL_W;
  if(r.type==='cut'){
   const w=width*et;
   const rx=r.side==='left'?x:x+width-w;
   ctx.fillRect(rx,y,w+0.6,CELL_H+0.5);
  }else{
   const remaining=width*(1-et);
   if(remaining<=0.2)continue;
   const rx=r.side==='left'?x+width-remaining:x;
   ctx.fillRect(rx,y,remaining+0.6,CELL_H+0.5);
  }
 }
}

function renderAt(now){
 const {maskT,configT}=activeProgress(now);
 const fromCfg=configTransition?configTransition.from:currentConfig;
 const toCfg=configTransition?configTransition.to:null;
 const diffs=maskTransition?maskTransition.runs:null;
 drawPieces(fromCfg,toCfg,configT,maskT,diffs);
 if(maskTransition){
  cutStableMask(maskTransition.from,maskTransition.to);
  drawDiffRuns(maskTransition.runs,maskT);
 }else{
  cutWholeMask(currentMask);
 }
 const maskDone=!maskTransition||maskT>=1;
 const configDone=!configTransition||configT>=1;
 if(maskDone&&maskTransition){currentMask=maskTransition.to;maskTransition=null}
 if(configDone&&configTransition){currentConfig=configTransition.to;configTransition=null}
 if(maskTransition||configTransition)frameHandle=requestAnimationFrame(renderAt);
 else frameHandle=0;
}

function kickRender(){
 if(!frameHandle)frameHandle=requestAnimationFrame(renderAt);
}

function melbourneParts(date){
 const parts=new Intl.DateTimeFormat('en-AU',{timeZone:TZ,hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(date);
 let hh='00',mm='00',ss='00';
 for(const p of parts){if(p.type==='hour')hh=p.value;else if(p.type==='minute')mm=p.value;else if(p.type==='second')ss=p.value}
 return{hh,mm,ss};
}

function applyTime(timeStr,seed,allowMinuteMorph=true){
 const nextMask=buildMask(timeStr);
 const oldMask=currentMask;
 const runs=buildDiffRuns(oldMask,nextMask);
 if(runs.length){
  maskTransition={from:oldMask,to:nextMask,runs,start:performance.now(),duration:620};
 }else currentMask=nextMask;
 if(seed!==currentSeed){
  if(allowMinuteMorph){
   configTransition={from:currentConfig,to:buildConfig(seed),start:performance.now(),duration:980};
  }else currentConfig=buildConfig(seed);
  currentSeed=seed;
 }
 currentTime=timeStr;
 kickRender();
}

function liveTick(){
 const p=melbourneParts(new Date());
 const str=`${p.hh}:${p.mm}:${p.ss}`;
 const seed=Number(p.hh)*60+Number(p.mm);
 applyTime(str,seed,true);
 tickTimer=setTimeout(liveTick,Math.max(50,1000-(Date.now()%1000)+20));
}

function demoTick(){
 demoSeconds=(demoSeconds+1)%(24*3600);demoTickCount++;
 const hh=String(Math.floor(demoSeconds/3600)%24).padStart(2,'0');
 const mm=String(Math.floor(demoSeconds/60)%60).padStart(2,'0');
 const ss=String(demoSeconds%60).padStart(2,'0');
 const seed=Math.floor(demoTickCount/6);
 applyTime(`${hh}:${mm}:${ss}`,seed,true);
 tickTimer=setTimeout(demoTick,900);
}

function initialise(){
 scaleStage();
 if(PREVIEW_FROM&&PREVIEW_TO){
  currentSeed=FIXED_SEED??0;currentConfig=buildConfig(currentSeed);
  const from=buildMask(PREVIEW_FROM),to=buildMask(PREVIEW_TO),runs=buildDiffRuns(from,to);
  drawPieces(currentConfig,null,1,PREVIEW_T,runs);
  cutStableMask(from,to);drawDiffRuns(runs,PREVIEW_T);return;
 }
 if(FIXED_TIME){
  currentTime=FIXED_TIME;currentMask=buildMask(FIXED_TIME);currentSeed=FIXED_SEED??0;currentConfig=buildConfig(currentSeed);
  drawPieces(currentConfig,null,1,1,null);cutWholeMask(currentMask);return;
 }
 const p=melbourneParts(new Date());
 currentTime=`${p.hh}:${p.mm}:${p.ss}`;currentMask=buildMask(currentTime);currentSeed=Number(p.hh)*60+Number(p.mm);currentConfig=buildConfig(currentSeed);
 drawPieces(currentConfig,null,1,1,null);cutWholeMask(currentMask);
 if(DEMO)tickTimer=setTimeout(demoTick,700);else tickTimer=setTimeout(liveTick,Math.max(50,1000-(Date.now()%1000)+20));
}

addEventListener('resize',scaleStage,{passive:true});
addEventListener('orientationchange',scaleStage,{passive:true});
document.addEventListener('visibilitychange',()=>{
 if(!document.hidden&&!FIXED_TIME&&!PREVIEW_FROM&&!DEMO){clearTimeout(tickTimer);liveTick()}
});
initialise();
})();
</script>
</body>
</html>
